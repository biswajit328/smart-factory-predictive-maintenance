[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-maintenance-top1"
version = "0.1.0"
description = "Leakage-free predictive maintenance project with production-style training and inference."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.135.2",
  "httpx==0.27.2",
  "joblib==1.4.2",
  "keras==3.3.3",
  "matplotlib==3.9.0",
  "numpy==1.26.4",
  "paho-mqtt==2.1.0",
  "pandas==2.2.2",
  "plotly==5.22.0",
  "scikit-learn==1.5.0",
  "seaborn==0.13.2",
  "tensorflow==2.16.1",
  "uvicorn==0.42.0",
]

[project.scripts]
pm-train = "src.train:main"
pm-demo = "src.inference:main"
pm-train-v2 = "src.v2_train:main"
pm-demo-v2 = "src.v2_inference:main"
pm-dashboard-v2 = "src.v2_dashboard:main"
pm-serve-v2 = "src.v2_api:main"
pm-serve-dashboard = "src.v2_dashboard_server:main"
pm-mqtt-replay = "src.v2_mqtt_replay:main"
pm-mqtt-bridge = "src.v2_mqtt_bridge:main"

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = false
warn_unused_ignores = false
